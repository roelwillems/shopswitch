<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopSwitch</title>
<style>
  :root {
    --ss-blue: #2563EB;
    --ss-green: #0DAA4C;
    --ss-red: #D94040;
    --ss-purple: #7C3AED;
    --ss-gray: #64748B;
    --ss-bg: #F8FAFC;
    --ss-card: #FFFFFF;
    --ss-border: #E2E8F0;
    --ss-text: #1E293B;
    --ss-text-dim: #64748B;
    --ss-radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 380px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--ss-bg);
    color: var(--ss-text);
    font-size: 13px;
    line-height: 1.5;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, var(--ss-blue), #1D4ED8);
    color: white;
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-logo {
    width: 28px; height: 28px;
    background: rgba(255,255,255,0.2);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px;
    flex-shrink: 0;
  }
  .header-text h1 {
    font-size: 15px; font-weight: 700; letter-spacing: -0.3px;
  }
  .header-text p {
    font-size: 10.5px; opacity: 0.8; font-weight: 400;
    margin-top: -1px;
  }
  .header-settings {
    margin-left: auto;
    background: rgba(255,255,255,0.15);
    border: none; color: white;
    border-radius: 6px; padding: 5px 7px;
    cursor: pointer; font-size: 14px;
    transition: background 0.15s;
  }
  .header-settings:hover { background: rgba(255,255,255,0.25); }

  /* ── Status bar ── */
  .status-bar {
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-bar.loading { background: #EFF6FF; color: var(--ss-blue); }
  .status-bar.found-cheaper { background: #F0FDF4; color: #15803D; }
  .status-bar.found-pricier { background: #FEF2F2; color: #B91C1C; }
  .status-bar.found-approx { background: #FAF5FF; color: var(--ss-purple); }
  .status-bar.found-neutral { background: #F0FDF4; color: #15803D; }
  .status-bar.not-found { background: #F1F5F9; color: var(--ss-gray); }
  .status-bar.error { background: #FEF2F2; color: var(--ss-red); }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  }
  .loading .status-dot { background: var(--ss-blue); animation: pulse 1.2s infinite; }
  .found-cheaper .status-dot { background: #15803D; }
  .found-pricier .status-dot { background: #B91C1C; }
  .found-approx .status-dot { background: var(--ss-purple); }
  .found-neutral .status-dot { background: #15803D; }
  .not-found .status-dot { background: var(--ss-gray); }
  .error .status-dot { background: var(--ss-red); }

  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  /* ── Amazon summary ── */
  .amazon-bar {
    padding: 10px 16px;
    border-bottom: 1px solid var(--ss-border);
    background: white;
  }
  .amazon-bar .label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--ss-text-dim); font-weight: 600; margin-bottom: 2px;
  }
  .amazon-bar .title {
    font-size: 12px; color: var(--ss-text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .amazon-bar .price {
    font-size: 13px; font-weight: 700; margin-top: 3px; color: var(--ss-text);
  }

  /* ── Product card ── */
  .match-card {
    margin: 12px 16px; padding: 14px;
    background: var(--ss-card);
    border: 1px solid var(--ss-border);
    border-radius: var(--ss-radius);
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .match-card:hover {
    border-color: var(--ss-blue);
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.1);
  }
  .match-card .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .store-badge {
    background: #0000A4; color: white;
    font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px;
    letter-spacing: 0.3px;
  }
  .match-pct {
    font-size: 11px; font-weight: 600;
    padding: 2px 7px; border-radius: 10px;
  }
  .match-pct.high { background: #DCFCE7; color: #15803D; }
  .match-pct.medium { background: #FEF3C7; color: #92400E; }
  .match-pct.low { background: #FEE2E2; color: #991B1B; }
  .match-pct.approx { background: #F3E8FF; color: #6B21A8; }

  .match-card .product-title {
    font-size: 12.5px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; margin-bottom: 8px;
  }

  .price-row {
    display: flex; align-items: baseline; gap: 8px;
    flex-wrap: wrap;
  }
  .bol-price {
    font-size: 18px; font-weight: 800;
  }
  .bol-price.cheaper { color: var(--ss-green); }
  .bol-price.pricier { color: var(--ss-red); }
  .bol-price.neutral { color: var(--ss-text); }

  .price-diff {
    font-size: 11px; font-weight: 600;
    padding: 2px 7px; border-radius: 8px;
  }
  .price-diff.save { background: #DCFCE7; color: #15803D; }
  .price-diff.more { background: #FEE2E2; color: #991B1B; }

  .amazon-ref-price {
    display: block;
    font-size: 11px;
    color: var(--ss-text-dim);
    margin-top: 2px;
  }

  .card-search-link {
    display: block;
    margin-top: 8px;
    font-size: 11px; font-weight: 500;
    color: var(--ss-text-dim);
    text-decoration: none;
    transition: color 0.15s;
  }
  .card-search-link:hover { color: var(--ss-blue); text-decoration: underline; }

  .arrow-icon {
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--ss-text-dim); font-size: 16px;
    transition: color 0.15s;
  }
  .match-card:hover .arrow-icon { color: var(--ss-blue); }

  /* ── Unavailable card ── */
  .match-card.unavailable { opacity: 0.55; }
  .match-card.unavailable:hover {
    border-color: var(--ss-gray);
    box-shadow: 0 2px 8px rgba(100, 116, 139, 0.1);
  }
  .match-card.unavailable:hover .arrow-icon { color: var(--ss-gray); }
  .unavailable-badge {
    font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 10px;
    background: #F1F5F9; color: var(--ss-gray);
  }
  .status-bar.found-unavailable { background: #F1F5F9; color: var(--ss-gray); }
  .found-unavailable .status-dot { background: var(--ss-gray); }

  /* ── Spec diff banner ── */
  .spec-diff-banner {
    margin-top: 8px; padding: 7px 10px;
    background: #FFF7ED; border: 1px solid #FED7AA;
    border-radius: 6px; font-size: 11px;
  }
  .spec-diff-banner .label {
    font-weight: 600; color: #9A3412; margin-bottom: 2px;
  }
  .spec-diff-item {
    display: flex; gap: 6px; color: #C2410C;
  }
  .spec-diff-item .spec-name { font-weight: 600; }
  .spec-diff-item .spec-values { font-weight: 400; }

  /* ── Alternative ── */
  .alternative {
    margin: 0 16px 12px; padding: 10px 12px;
    background: var(--ss-card);
    border: 1px dashed var(--ss-border);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
    font-size: 11.5px;
  }
  .alternative:hover { border-color: var(--ss-blue); }
  .alt-header {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px;
    color: var(--ss-text-dim); font-weight: 600; margin-bottom: 4px;
  }
  .alt-title {
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    overflow: hidden; margin-bottom: 3px;
  }
  .alt-meta {
    display: flex; gap: 8px; align-items: center;
  }
  .alt-meta .alt-price { font-weight: 700; }
  .alt-meta .alt-match {
    font-size: 10px; font-weight: 600;
    padding: 1px 6px; border-radius: 8px;
    background: #F1F5F9; color: var(--ss-gray);
  }

  /* ── Footer ── */
  .footer {
    padding: 10px 16px;
    border-top: 1px solid var(--ss-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer a {
    color: var(--ss-blue); text-decoration: none;
    font-size: 11.5px; font-weight: 500;
  }
  .footer a:hover { text-decoration: underline; }
  .footer .version {
    font-size: 10px; color: var(--ss-text-dim);
  }

  /* ── Empty states ── */
  .empty-state {
    padding: 32px 24px; text-align: center;
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 8px; }
  .empty-state h3 { font-size: 14px; margin-bottom: 4px; }
  .empty-state p { font-size: 12px; color: var(--ss-text-dim); }
</style>
</head>
<body>
  <div class="header">
    <div class="header-logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 9h16l-4-4M20 15H4l4 4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="header-text">
      <h1>ShopSwitch</h1>
      <p>Find it locally, buy it smarter</p>
    </div>
    <button class="header-settings" id="settingsBtn" title="Settings">⚙</button>
  </div>
  <div id="content"></div>
  <script src="popup.js"></script>
</body>
</html>
